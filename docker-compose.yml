services:
    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        environment:
            NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
            NGINX_SSL_ENABLED: ${NGINX_SSL_ENABLED:-false}
            NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-/etc/nginx/certs/fullchain.pem}
            NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-/etc/nginx/certs/privkey.pem}
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            - frontend
            - backend
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: docker/frontend/Dockerfile
        env_file:
            - ./frontend/.env
        depends_on:
            - backend
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: docker/backend/Dockerfile
        env_file:
            - ./backend/.env
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - backend_uploads:/app/uploads
            - backend_logs:/app/logs
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        command: --lower-case-table-names=1
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-FrolovDev}
            MYSQL_USER: ${MYSQL_USER:-user}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        ports:
            - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
        volumes:
            - ./docker/mysql/data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

volumes:
    backend_uploads:
    backend_logs:
